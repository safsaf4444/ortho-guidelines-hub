name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22, matching detect-changes.yml, approve-change.yml,
          # dead-link-check.yml and guideline-sync.yml. Previously 20, which
          # worked (vite@8 needs ^20.19.0 || >=22.12.0, and `20` resolves to
          # the latest 20.x) but with zero headroom on an end-of-life release
          # line. Bumped ahead of the 20 Sep 2026 presentation to remove that
          # risk, not to fix a live break.
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public configuration ONLY. These two values are the entire client
          # configuration, and both are safe to ship in a public bundle.
          #
          # HOW AUTHORISATION ACTUALLY WORKS. This bundle CAN initiate writes:
          # an editor signs in through the app (email + password) and the
          # resulting session accompanies every request. What decides whether a
          # write is allowed is PostgreSQL Row Level Security plus the editor
          # allowlist in `public.is_editor()` — enforced in the database, not
          # by this workflow, not by the bundle, and not by possession of a key.
          # An unauthenticated visitor holding the anon key can only read.
          # See SECURITY.md.
          #
          # The anon key is therefore a routing credential, not a permission.
          # It is public by design and cannot be made secret: it ships in every
          # build and is a literal fallback below.
          #
          # NEVER add SUPABASE_SERVICE_ROLE_KEY here, and never add a
          # VITE_-prefixed copy of it under any name. That key BYPASSES RLS
          # entirely, so shipping it would hand every visitor full write access
          # to all 231 clinical rows and make the allowlist irrelevant.
          # scripts/tests/write-access.test.ts fails the build if a
          # service-role key, a JWT-shaped string, or an editor account UUID
          # appears anywhere in dist/.
          #
          # No editor identity belongs here either. The allowlist lives in the
          # database so it can be changed without a redeploy; mirroring it into
          # the bundle would create a second source of truth that can drift.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://xutjahmbyrvifcltpxxu.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_MdOTKiEJr1RMUuMEY2lJNQ_Lhggiv3M' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
