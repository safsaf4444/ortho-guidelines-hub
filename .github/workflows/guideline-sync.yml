name: Guideline & Provider Sync (manual dispatch only)

on:
  # ── WEEKLY SCHEDULE DELIBERATELY DISABLED ──────────────────────────────────
  # Disabled so that merging this branch deploys the frontend WITHOUT also
  # starting automatic candidate staging. The frontend fix is urgent (the
  # deployed site's edits fail silently against the new RLS policies); starting
  # a weekly job that writes to the live review queue is not, and it should not
  # ride along on the same merge.
  #
  # While this block is commented out, nothing files candidates automatically.
  # scripts/stage-candidates.ts is referenced by THIS workflow and no other, and
  # no workflow_call / workflow_run / repository_dispatch path reaches it, so a
  # manual dispatch below is the only way it can run.
  #
  # TO RE-ENABLE after live verification, and only with the owner's explicit
  # approval: delete the three commented lines below. Note that on the schedule
  # trigger `inputs.dry_run` does not exist and arrives empty, which the script
  # treats as false — so a scheduled run performs REAL writes to
  # staged_guidelines from the first firing.
  #
  # schedule:
  #   # Every Sunday at 02:00 UTC
  #   - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Verification mode. When true, discovery runs and the candidate report
          is still uploaded, but NOTHING is written to Supabase — the staging
          step only logs what it would file. Leave true unless you deliberately
          want this manual run to add rows to the review queue.
        type: boolean
        default: true
        required: false

# The discovery pass is read-only and never writes back to the repo. The
# staging step writes to Supabase, not to git, so no write scope is needed
# here either. Declared explicitly so the intent survives any change to the
# repository-level default permissions.
permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 for native WebSocket support, which the Supabase client
          # needs — on Node 20 it fails with "Node.js 20 detected without
          # native WebSocket support". Kept in step with detect-changes.yml.
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Discovery only: no Supabase connection, no repo writes. Produces
      # candidates.json.
      - name: Run Provider Sync Probe (Dry-run)
        run: npx tsx scripts/sync-providers.ts

      # Uploaded BEFORE staging, so a failure in the staging step still leaves
      # the discovery evidence downloadable for diagnosis.
      - name: Upload Candidate Report
        uses: actions/upload-artifact@v4
        with:
          name: sync-candidates
          path: candidates.json

      # Files newly discovered candidates into public.staged_guidelines for
      # editor review.
      #
      # The service-role key is required and not incidental: staged_guidelines
      # has no INSERT policy for any browser-reachable role, so this key is the
      # only way in. That is what keeps the review queue un-injectable from the
      # public site.
      #
      # Files through public.stage_sync_candidates(), which never modifies an
      # existing queue row, so a candidate an editor has already accepted or
      # rejected is NOT reset to pending by the next run. PARTIAL SUCCESS: a
      # failed candidate is rolled back alone (step exits 1) while the others
      # commit; re-running the same report retries only the failures. Requires
      # supabase/migrations/20261024_discovery_review_queue.sql to be applied
      # FIRST — see the header comment in scripts/stage-candidates.ts.
      #
      # Nothing here touches `guidelines`. Publishing stays a human action in
      # the app, through approve_staged_guideline().
      - name: File candidates into the review queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Empty on the schedule trigger (the input does not exist there),
          # which the script treats as false — so scheduled runs file candidates
          # as intended. Only a manual dispatch can set this to true.
          DRY_RUN: ${{ inputs.dry_run }}
        run: npx tsx scripts/stage-candidates.ts
