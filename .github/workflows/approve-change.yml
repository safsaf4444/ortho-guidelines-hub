name: Acknowledge guideline change request

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  approve:
    # Only run on issues carrying the auto-detection label, and only act on
    # a comment from the repo owner/collaborators -- never from a random
    # public commenter on this public repo.
    if: >
      contains(github.event.issue.labels.*.name, 'pending-guideline-update') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Repository runtime; this handler has no database or publisher client.
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Acknowledge request (no database authority)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: npx tsx scripts/approve-change.ts
