name: Detect guideline changes

on:
  schedule:
    # Every Monday at 06:00 UTC. Change this line to adjust frequency.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Verification mode. When true, the run fetches and compares source
          content and logs every change it WOULD act on, but performs no
          external writes at all: no GitHub issues, no Supabase updates, and no
          commit/push of blocked-sources.json. Leave true unless you
          deliberately want this manual run to modify production data.
        type: boolean
        default: true
        required: false

permissions:
  contents: write   # to commit the updated blocked-sources.json back to the repo
  issues: write      # to open the "pending-guideline-update" issues

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22: the Supabase realtime client needs native WebSocket support.
          # On Node 20 the run fails with "Node.js 20 detected without native
          # WebSocket support".
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run change detection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Empty on the schedule trigger (the input does not exist there), which
          # the script treats as false — so scheduled runs keep writing exactly
          # as before. Only a manual dispatch can set this to true.
          DRY_RUN: ${{ inputs.dry_run }}
        run: npx tsx scripts/detect-changes.ts

      # Skipped entirely on a dry-run dispatch. On the schedule trigger
      # inputs.dry_run is null, so `!= true` holds and the step runs as before.
      - name: Commit updated blocked-sources.json (if changed)
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "ortho-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/blocked-sources.json
          git diff --cached --quiet || git commit -m "chore: update blocked-sources.json from automated change check"
          git push
