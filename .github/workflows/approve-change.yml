name: Approve or reject guideline change

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  approve:
    # Only run on issues carrying the auto-detection label, and only act on
    # a comment from the repo owner/collaborators -- never from a random
    # public commenter on this public repo.
    if: >
      contains(github.event.issue.labels.*.name, 'pending-guideline-update') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22, matching detect-changes.yml. scripts/approve-change.ts uses
          # the same @supabase/supabase-js client, whose realtime component needs
          # native WebSocket support; on Node 20 that failed with "Node.js 20
          # detected without native WebSocket support" (detect-changes run #1).
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Process approval/rejection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: npx tsx scripts/approve-change.ts
